name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, builds and browser tests
    runs-on: ubuntu-latest
    # Браузерный набор (176 сценариев × desktop + mobile, один воркер) занимает
    # около 23 минут локально, плюс установка зависимостей, сборка и проверка
    # архива. Прежних 20 минут не хватало: джоб успевал умереть посреди
    # browser smoke, и это выглядело как падение приложения.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install reconciles package.json with the lockfile, including Playwright.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck and lint
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Build and validate Yandex Games archive
        run: npm run build:yg

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
