services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  node_modules:
